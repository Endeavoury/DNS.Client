[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ratatoskr-sdk"
dynamic = ["version"]
description = "Python binding for the Ratatoskr cross-language networking SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Endeavoury" }]
keywords = ["dns", "networking", "resolver", "ffi", "ratatoskr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Endeavoury/Ratatoskr"
Documentation = "https://github.com/Endeavoury/Ratatoskr/tree/main/bindings/python"
Issues = "https://github.com/Endeavoury/Ratatoskr/issues"
Source = "https://github.com/Endeavoury/Ratatoskr"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "ratatoskr._version.__version__" }

[tool.setuptools.package-data]
ratatoskr = [
  "py.typed",
  "_native/README.md",
  "_native/*/*.so",
  "_native/*/*.dylib",
  "_native/*/*.dll",
]
