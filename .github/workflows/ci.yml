name: Ratatoskr CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-dotnet:
    name: ${{ matrix.os }} native + .NET
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Configure native build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRATOS_BUILD_TESTS=ON
      - name: Build native core and CLI
        run: cmake --build build --config Release --parallel
      - name: Native and CLI tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Make native library discoverable
        shell: bash
        run: |
          echo "$PWD/build" >> "$GITHUB_PATH"
          echo "$PWD/build/Release" >> "$GITHUB_PATH"
      - name: Build managed binding and compatibility API
        run: dotnet build bindings/dotnet/Ratatoskr.sln --configuration Release
      - name: Test C# to native C path
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/build
        run: dotnet test bindings/dotnet/tests/Ratatoskr.Compatibility.Tests/Ratatoskr.Compatibility.Tests.csproj --configuration Release --no-build
      - name: Collect managed compatibility coverage
        if: runner.os == 'Linux'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
        run: >-
          dotnet test bindings/dotnet/tests/Ratatoskr.Compatibility.Tests/Ratatoskr.Compatibility.Tests.csproj
          --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --settings bindings/dotnet/coverlet.runsettings
          --results-directory artifacts/coverage
      - name: Generate coverage percentage summary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.16
          reportgenerator -reports:"artifacts/coverage/**/coverage.cobertura.xml" -targetdir:artifacts/coverage-report -reporttypes:"TextSummary;Html"
          cat artifacts/coverage-report/Summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-${{ github.run_number }}
          path: |
            artifacts/coverage/
            artifacts/coverage-report/
      - name: Verify exported ABI symbols
        if: runner.os == 'Linux'
        shell: bash
        run: |
          nm -D --defined-only build/libratatoskr.so | grep ' ratos_context_create$'
          nm -D --defined-only build/libratatoskr.so | grep ' ratos_dns_query$'
          nm -D --defined-only build/libratatoskr.so | grep ' ratos_dns_result_destroy$'

  sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DRATOS_ENABLE_SANITIZERS=ON -DRATOS_BUILD_TESTS=ON
      - run: cmake --build build-sanitize --parallel
      - run: ctest --test-dir build-sanitize --output-on-failure

  java-binding:
    name: Java 22 FFM binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - name: Build native core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRATOS_BUILD_CLI=OFF -DRATOS_BUILD_TESTS=OFF
          cmake --build build --parallel
      - name: Verify Java to native DNS path
        run: >-
          mvn --batch-mode --file bindings/java/pom.xml verify
          -Dratatoskr.library.path=${{ github.workspace }}/build/libratatoskr.so

  python-binding:
    name: Python ctypes binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build native core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRATOS_BUILD_CLI=OFF -DRATOS_BUILD_TESTS=OFF
          cmake --build build --parallel
      - name: Verify Python to native DNS path
        env:
          RATATOSKR_LIBRARY: ${{ github.workspace }}/build/libratatoskr.so
          PYTHONPATH: ${{ github.workspace }}/bindings/python/src
        run: python -m unittest discover -s bindings/python/tests -v
      - name: Compile Python sources
        run: python -m compileall -q bindings/python/src bindings/python/tests bindings/python/examples

  release-metadata:
    name: Release metadata guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python tools/validate_release.py

  package-smoke:
    name: NuGet package layout smoke test
    runs-on: ubuntu-latest
    needs: native-and-dotnet
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Stage Linux native asset
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRATOS_BUILD_TESTS=OFF
          cmake --build build --parallel
          mkdir -p bindings/dotnet/runtimes/linux-x64/native
          cmake -E copy build/libratatoskr.so bindings/dotnet/runtimes/linux-x64/native/libratatoskr.so
      - name: Pack canonical and compatibility packages
        run: |
          dotnet pack bindings/dotnet/src/Ratatoskr/Ratatoskr.csproj --configuration Release --output artifacts -p:PackageVersion=0.0.0-ci.${{ github.run_number }}
          dotnet pack bindings/dotnet/src/Ratatoskr.Compatibility/Ratatoskr.Compatibility.csproj --configuration Release --output artifacts -p:PackageVersion=0.0.0-ci.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: ratatoskr-nuget-${{ github.run_number }}
          path: artifacts/*.nupkg
