name: Create semantic release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: semantic-release-master
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DNS.Client.sln

      - name: Build
        run: dotnet build DNS.Client.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DNS.Client.Tests/DNS.Client.Tests.csproj --configuration Release --no-build

  publish:
    name: Tag, release, and publish
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install .NET SDK and configure GitHub Packages
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

      - name: Select next semantic version
        id: version
        shell: bash
        run: |
          latest_tag="$(git tag --list 'v[0-9]*' \
            | grep -E '^v[0-9]+\\.[0-9]+\\.[0-9]+$' \
            | sort -V | tail -n 1 || true)"

          if [[ -z "$latest_tag" ]]; then
            tag="v1.0.0"
          else
            IFS=. read -r major minor patch <<< "${latest_tag#v}"
            patch=$((patch + 1))
            tag="v${major}.${minor}.${patch}"
          fi

          # Avoid a collision if two manually retried runs race with a tag push.
          while git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null 2>&1; do
            IFS=. read -r major minor patch <<< "${tag#v}"
            patch=$((patch + 1))
            tag="v${major}.${minor}.${patch}"
          done

          version="${tag#v}"
          echo "Creating release $tag for $GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" "$GITHUB_SHA" --message "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes

      - name: Pack release package
        run: >-
          dotnet pack DNS.Client/DNS.Client.csproj
          --configuration Release
          --output artifacts
          -p:PackageVersion=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Publish to GitHub Packages
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER || 'RoyGerritse' }}

      - name: Publish to nuget.org
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

  release-manual-tag:
    name: Create release for manual version tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
