name: Build and publish package

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DNS.Client.sln

      - name: Build
        run: dotnet build DNS.Client.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DNS.Client.Tests/DNS.Client.Tests.csproj --configuration Release --no-build

      - name: Verify package creation
        run: >-
          dotnet pack DNS.Client/DNS.Client.csproj
          --configuration Release
          --no-build
          --output artifacts
          -p:PackageVersion=0.0.0-ci.${{ github.run_number }}

  publish:
    name: Publish GitHub package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET SDK and configure GitHub Packages
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

      - name: Restore
        run: dotnet restore DNS.Client/DNS.Client.csproj

      - name: Pack release tag
        shell: bash
        run: |
          package_version="${GITHUB_REF_NAME#v}"
          dotnet pack DNS.Client/DNS.Client.csproj \
            --configuration Release \
            --output artifacts \
            -p:PackageVersion="$package_version" \
            -p:ContinuousIntegrationBuild=true

      - name: Publish to GitHub Packages
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "$NUGET_AUTH_TOKEN"
          --skip-duplicate
