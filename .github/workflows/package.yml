name: Ratatoskr release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v
        required: true
        default: 0.1.0

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, args: "", test: true }
          - { os: ubuntu-latest, rid: linux-arm64, args: "-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc", test: false }
          - { os: macos-latest, rid: osx-x64, args: "-DCMAKE_OSX_ARCHITECTURES=x86_64", test: false }
          - { os: macos-latest, rid: osx-arm64, args: "-DCMAKE_OSX_ARCHITECTURES=arm64", test: false }
          - { os: windows-latest, rid: win-x64, args: "-A x64", test: true }
          - { os: windows-latest, rid: win-arm64, args: "-A ARM64", test: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux ARM64 cross compiler
        if: matrix.rid == 'linux-arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRATOS_BUILD_TESTS=${{ matrix.test && 'ON' || 'OFF' }} ${{ matrix.args }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test host build
        if: matrix.test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage NuGet native asset
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          mkdir -p "stage/$RID/native"
          case "$RID" in
            linux-*) cmake -E copy build/libratatoskr.so "stage/$RID/native/libratatoskr.so" ;;
            osx-*) cmake -E copy build/libratatoskr.dylib "stage/$RID/native/libratatoskr.dylib" ;;
            win-*) cmake -E copy build/Release/ratatoskr.dll "stage/$RID/native/ratatoskr.dll" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: stage/

  nuget:
    runs-on: ubuntu-latest
    needs: native
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: bindings/dotnet/runtimes
          merge-multiple: true
      - name: Select version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Pack Ratatoskr with all native runtimes
        run: |
          dotnet pack bindings/dotnet/src/Ratatoskr/Ratatoskr.csproj --configuration Release --output artifacts -p:PackageVersion=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true
          dotnet pack bindings/dotnet/src/Ratatoskr.Compatibility/Ratatoskr.Compatibility.csproj --configuration Release --output artifacts -p:PackageVersion=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v4
        with:
          name: ratatoskr-${{ steps.version.outputs.value }}
          path: artifacts/*
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --verify-tag --generate-notes --title "${{ github.ref_name }}"
