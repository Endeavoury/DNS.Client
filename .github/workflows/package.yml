name: Ratatoskr release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v
        required: true
        default: 0.1.0
      publish_pypi:
        description: Publish the validated Python distributions through PyPI Trusted Publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Select and validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          python tools/validate_release.py "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

  native:
    needs: release_metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, args: "", test: true }
          - { os: ubuntu-latest, rid: linux-arm64, args: "-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc", test: false }
          - { os: macos-latest, rid: osx-x64, args: "-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0", test: false }
          - { os: macos-latest, rid: osx-arm64, args: "-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0", test: false }
          - { os: windows-latest, rid: win-x64, args: "-A x64", test: true }
          - { os: windows-latest, rid: win-arm64, args: "-A ARM64", test: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux ARM64 cross compiler
        if: matrix.rid == 'linux-arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRATOS_BUILD_TESTS=${{ matrix.test && 'ON' || 'OFF' }} ${{ matrix.args }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test host build
        if: matrix.test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage NuGet native asset
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          mkdir -p "stage/$RID/native"
          case "$RID" in
            linux-*) cmake -E copy build/libratatoskr.so "stage/$RID/native/libratatoskr.so" ;;
            osx-*) cmake -E copy build/libratatoskr.dylib "stage/$RID/native/libratatoskr.dylib" ;;
            win-*) cmake -E copy build/Release/ratatoskr.dll "stage/$RID/native/ratatoskr.dll" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: stage/

  nuget:
    runs-on: ubuntu-latest
    needs: [release_metadata, native]
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: bindings/dotnet/runtimes
          merge-multiple: true
      - name: Pack Ratatoskr with all native runtimes
        env:
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.version }}
        run: |
          dotnet pack bindings/dotnet/src/Ratatoskr/Ratatoskr.csproj --configuration Release --output artifacts -p:PackageVersion="$RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
          dotnet pack bindings/dotnet/src/Ratatoskr.Compatibility/Ratatoskr.Compatibility.csproj --configuration Release --output artifacts -p:PackageVersion="$RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v4
        with:
          name: ratatoskr-${{ needs.release_metadata.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

  maven:
    runs-on: ubuntu-latest
    needs: [release_metadata, native]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: bindings/java/target/native-stage
          merge-multiple: true
      - name: Stage Java native resources
        shell: bash
        working-directory: bindings/java
        run: |
          mkdir -p src/main/resources/META-INF/native/{linux-x86_64,linux-aarch64,macos-x86_64,macos-aarch64,windows-x86_64,windows-aarch64}
          cp target/native-stage/linux-x64/native/libratatoskr.so src/main/resources/META-INF/native/linux-x86_64/
          cp target/native-stage/linux-arm64/native/libratatoskr.so src/main/resources/META-INF/native/linux-aarch64/
          cp target/native-stage/osx-x64/native/libratatoskr.dylib src/main/resources/META-INF/native/macos-x86_64/
          cp target/native-stage/osx-arm64/native/libratatoskr.dylib src/main/resources/META-INF/native/macos-aarch64/
          cp target/native-stage/win-x64/native/ratatoskr.dll src/main/resources/META-INF/native/windows-x86_64/
          cp target/native-stage/win-arm64/native/ratatoskr.dll src/main/resources/META-INF/native/windows-aarch64/
      - name: Build Maven Central-ready package
        working-directory: bindings/java
        env:
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.version }}
        run: >-
          mvn --batch-mode verify
          -Drevision="$RELEASE_VERSION"
          -Dratatoskr.library.path=${{ github.workspace }}/bindings/java/target/native-stage/linux-x64/native/libratatoskr.so
      - uses: actions/upload-artifact@v4
        with:
          name: ratatoskr-maven-${{ needs.release_metadata.outputs.version }}
          path: |
            bindings/java/target/ratatoskr-*.jar
            bindings/java/target/ratatoskr-*.pom
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    needs: [release_metadata, native]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: bindings/python/native-stage
          merge-multiple: true
      - name: Install Python packaging tools
        run: python -m pip install --disable-pip-version-check build setuptools
      - name: Build six native wheels and source distribution
        env:
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.version }}
        run: >-
          python bindings/python/tools/build_release_wheels.py
          --native-stage bindings/python/native-stage
          --output bindings/python/dist
          --version "$RELEASE_VERSION"
      - name: Verify installed Linux wheel uses its bundled native core
        shell: bash
        run: |
          python -m venv bindings/python/wheel-smoke
          bindings/python/wheel-smoke/bin/python -m pip install --disable-pip-version-check bindings/python/dist/*-py3-none-linux_x86_64.whl
          RATATOSKR_TEST_NATIVE=1 bindings/python/wheel-smoke/bin/python -m unittest discover -s bindings/python/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: ratatoskr-pypi-${{ needs.release_metadata.outputs.version }}
          path: bindings/python/dist/*
          if-no-files-found: error

  pypi:
    runs-on: ubuntu-latest
    needs: [python, nuget, maven]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true
    environment:
      name: pypi
      url: https://pypi.org/project/ratatoskr-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: ratatoskr-pypi-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    runs-on: ubuntu-latest
    needs: [nuget, maven, python]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: ratatoskr-*
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" artifacts/* --clobber
          else
            gh release create "${{ github.ref_name }}" artifacts/* --verify-tag --generate-notes --title "${{ github.ref_name }}"
          fi
